<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loja</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #f2f2f2;
            --white: #fff;
            --text: #161823;
            --text-muted: #73747b;
            --accent: #ff2d55;
            --dark: #111827;
            --border: #e5e7eb
        }

        html {
            font-size: 15px
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
            font: inherit;
            color: inherit
        }

        .store-header {
            background: var(--dark);
            color: #fff;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10
        }

        .store-header svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0
        }

        .store-search {
            flex: 1;
            margin: 0 10px;
            background: rgba(255, 255, 255, .15);
            border: none;
            border-radius: 20px;
            padding: 8px 14px;
            color: #fff;
            font-size: 13px;
            outline: none
        }

        .store-search::placeholder {
            color: rgba(255, 255, 255, .5)
        }

        .store-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px
        }

        .store-cats {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 0;
            scrollbar-width: none
        }

        .store-cats::-webkit-scrollbar {
            display: none
        }

        .store-cat {
            flex-shrink: 0;
            padding: 6px 14px;
            border-radius: 20px;
            background: #fff;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid var(--border)
        }

        .store-cat.active {
            background: var(--dark);
            color: #fff;
            border-color: var(--dark)
        }

        .store-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px
        }

        .store-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            text-align: left
        }

        .store-card-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            background: #f3f4f6
        }

        .store-card-info {
            padding: 8px
        }

        .store-card-name {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden
        }

        .store-card-price {
            font-size: 14px;
            font-weight: 800;
            color: var(--accent)
        }

        .store-empty {
            grid-column: span 2;
            text-align: center;
            padding: 40px;
            color: #9ca3af;
            font-size: 13px
        }
    </style>
</head>

<body>
    <div class="store-header">
        <button onclick="goBack()" aria-label="Voltar">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <path d="M15 18l-6-6 6-6" />
            </svg>
        </button>
        <input class="store-search" placeholder="Buscar produtos...">
        <button onclick="goCart()" aria-label="Carrinho">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <circle cx="9" cy="21" r="1" />
                <circle cx="20" cy="21" r="1" />
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
            </svg>
        </button>
    </div>
    <div class="store-body">
        <div class="store-cats">
            <div class="store-cat active">Todos</div>
            <div class="store-cat">Roupas</div>
            <div class="store-cat">Calçados</div>
            <div class="store-cat">Acessórios</div>
        </div>
        <div class="store-grid" id="storeGrid">
            <div class="store-empty">Configure produtos para visualizar a loja</div>
        </div>
    </div>

    <script>
        let PROJECT = null;

        function fmtBRL(n) { return Number(n || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
        function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

        function goBack() {
            if (window.history.length > 1) history.back();
            else window.location.href = 'template_lp.html';
        }
        function goCart() {
            if (window.self !== window.top) return;
            window.location.href = 'cart.html';
        }

        // Recebe atualizações em tempo real quando embutido como preview no editor admin
        window.addEventListener('message', (e) => {
            if (!e.data || e.data.type !== 'epro:update') return;
            PROJECT = e.data.project;
            render();
        });

        // Modo standalone: carrega o último projeto salvo
        (function tryLoadStandalone() {
            try {
                const raw = localStorage.getItem('epro_lp_project');
                if (raw) { PROJECT = JSON.parse(raw); render(); }
            } catch (_) { }
        })();

        function openMainProduct() {
            if (window.self !== window.top) return;
            window.location.href = 'template_lp.html';
        }

        function openRecommendation(index) {
            if (window.self !== window.top) return;
            if (!PROJECT || !PROJECT.recommendations || !PROJECT.recommendations.items[index]) return;
            const rec = PROJECT.recommendations.items[index];
            const newProject = JSON.parse(JSON.stringify(PROJECT));
            newProject.basico.title = rec.title;
            newProject.basico.price = rec.price;
            const discPct = newProject.recommendations.discount || 40;
            newProject.basico.price_original = rec.price / (1 - (discPct / 100));
            newProject.basico.images = [rec.image];
            newProject.basico.external_link = rec.checkout_url || '';
            newProject.basico.own_checkout = !rec.checkout_url;
            if (rec.variations && rec.variations.length) {
                newProject.variationGroups = [{
                    name: rec.variation_name || 'Modelo',
                    options: rec.variations.map(v => ({ value: v.value || v.label, price: v.price || rec.price, image: v.image || '', checkout_url: v.checkout_url || '' }))
                }];
            } else {
                newProject.variationGroups = [];
            }
            newProject.reviews = [];
            newProject.orderBumps = [];
            try { localStorage.setItem('epro_lp_project', JSON.stringify(newProject)); } catch (_) { }
            window.location.href = 'template_lp.html';
        }

        function render() {
            const grid = document.getElementById('storeGrid');
            if (!PROJECT) { grid.innerHTML = '<div class="store-empty">Configure produtos para visualizar a loja</div>'; return; }

            const b = PROJECT.basico || {};
            const recs = (PROJECT.recommendations && PROJECT.recommendations.items) || [];
            const allProducts = [];
            if (b.title) allProducts.push({ type: 'main', name: b.title, price: b.price, image: (b.images || [])[0] || '' });
            recs.forEach((r, i) => allProducts.push({ type: 'rec', index: i, name: r.title, price: r.price, image: r.image || '' }));

            if (!allProducts.length) { grid.innerHTML = '<div class="store-empty">Configure produtos para visualizar a loja</div>'; return; }

            grid.innerHTML = allProducts.map(p => `
        <button class="store-card" onclick="${p.type === 'main' ? 'openMainProduct()' : 'openRecommendation(' + p.index + ')'}">
            ${p.image ? `<img class="store-card-img" src="${esc(p.image)}" alt="${esc(p.name)}" onerror="this.style.background='#e5e7eb'">` : '<div class="store-card-img"></div>'}
            <div class="store-card-info">
                <div class="store-card-name">${esc(p.name)}</div>
                <div class="store-card-price">R$ ${fmtBRL(p.price || 0)}</div>
            </div>
        </button>`).join('');
        }
    </script>
</body>

</html>
